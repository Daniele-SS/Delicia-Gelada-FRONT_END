<!DOCTYPE html>
<html lang="pt-br" class="font-inter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueceu a Senha | Delicia Gelada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/admin.js" defer></script>
</head>
<body class="font-inter text-gray-900">

  <div id="tela-login" class="relative h-screen w-full">
    <img src="../img/body.jpeg" alt="Fundo" class="absolute inset-0 h-full w-full object-cover">

    <div class="relative z-10 flex h-full">
      <div class="flex flex-col justify-center items-center w-full">
        <img src="../img/logo.png" alt="Logo Delícia Gelada" class="w-36 mb-6">
        
        <h1 class="text-orange-500 font-bold text-2xl text-center mb-2">Recuperar Senha</h1>
        <p class="text-gray-500 text-sm text-center mb-6 max-w-[280px]">
          Digite o seu e-mail abaixo. Enviaremos um link para redefinir sua senha.
        </p>

        <div class="w-full max-w-sm flex flex-col gap-4">
          <input type="email" id="emailRecuperacao" placeholder="E-mail"
            class="w-full border border-gray-300 rounded px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-orange-400">
            
          <button onclick="recuperarSenha(event)"
            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded tracking-widest transition">
            ENVIAR LINK
          </button>

          <div class="text-center mt-2">
            <a href="../../admin.html" class="text-blue-500 text-sm hover:underline font-medium">
              ← Voltar para o Login
            </a>
          </div>
        </div>
      </div>

      <div class="hidden md:block md:w-1/2"></div>
    </div>
  </div>

</body>
</html>

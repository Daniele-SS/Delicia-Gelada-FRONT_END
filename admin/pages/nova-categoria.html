<!DOCTYPE html>
<html lang="pt-br" class="font-inter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Categoria | Delicia Gelada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/admin.js" defer type="module"></script>
</head>
<body class="font-sans bg-gray-100">

  <div id="tela-adicionar-categoria" class="min-h-screen w-full">
    <aside class="hidden md:flex w-64 bg-[#E4F3F4] flex-col items-center py-8 px-4 h-screen fixed top-0 left-0 z-20">
      <img src="./img/logo.png" alt="Logo Delícia Gelada" class="w-28 mb-6">
      <p class="text-gray-700 text-sm tracking-widest mb-auto">Área Administrativa</p>
      <div class="flex flex-col items-center gap-2 mt-auto">
        <img src="./img/gestor.png" alt="Foto do gestor"
          class="w-24 h-24 rounded-full object-cover border-4 border-white shadow">
        <p class="text-sm font-semibold text-gray-700">NOME</p>
        <p class="text-xs text-gray-500">Gestor(a)</p>
      </div>
    </aside>

    <header class="md:hidden w-full bg-[#E4F3F4] flex items-center justify-between px-4 py-3">
      <img src="./img/logo.png" alt="Logo Delícia Gelada" class="w-16">
      <p class="text-gray-700 text-xs tracking-widest">Área Administrativa</p>
    </header>

    <main class="md:pl-64 w-full min-h-screen p-6 md:p-10">

      <div class="flex items-center gap-3 mb-8">
        <div class="w-1.5 h-10 bg-orange-500 rounded-sm"></div>
        <h2 class="text-blue-900 font-bold text-xl md:text-3xl">Adicionar Nova Categoria</h2>
      </div>

      <div class="flex flex-col gap-4 max-w-sm">
        <div>
          <label class="text-blue-600 font-bold text-xs block mb-1">NOME DA CATEGORIA</label>
          <input type="text" id="nomeCategoria" placeholder="Ex: Bebidas Tropicais, Alcoólicos, Vinhos..."
            class="w-full border border-gray-300 rounded px-3 py-2 text-sm bg-white">
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="categoriaAtiva" checked class="w-4 h-4 accent-blue-500">
          <label for="categoriaAtiva" class="text-blue-500 text-sm font-medium">Categoria Ativa</label>
        </div>
      </div>

      <div class="flex flex-col md:flex-row gap-3 mt-auto md:absolute md:bottom-10 md:right-10">
        <button onclick="window.location.href='dashboard.html'"
          class="px-8 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded transition">
          CANCELAR
        </button>
        <button onclick="salvarNovaCategoria()"
          class="px-8 py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded transition">
          SALVAR CATEGORIA
        </button>
      </div>

    </main>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br" class="font-inter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Delicia Gelada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/admin.js" defer></script>
</head>
<body class="font-sans bg-gray-50">

  <div id="tela-dashboard" class="min-h-screen flex flex-col md:flex-row">
    
    <aside class="hidden md:flex w-64 bg-[#E4F3F4] flex-col items-center py-8 px-4 h-screen fixed top-0 left-0 z-20">
      <img src="../img/logo.png" alt="Logo Delícia Gelada" class="w-28 mb-6">
      <p class="text-gray-900 text-sm tracking-widest mb-auto font-medium" style="font-family: cursive;">Área Administrativa</p>
      
      <div class="flex flex-col items-center gap-1 mt-auto w-full">
        <img src="../img/gestor.png" alt="Foto do gestor"
          class="w-20 h-20 rounded-full object-cover border-2 border-white shadow mb-1">
        <p class="text-sm font-bold text-gray-800">Rodrigo</p>
        <p class="text-xs text-gray-600 font-medium mb-3">Gestor</p>
        
        <button onclick="window.location.href='../../admin.html'" 
          class="flex items-center gap-2 px-4 py-2 text-sm font-bold text-red-500 hover:text-white hover:bg-red-500 rounded-lg transition-colors w-full justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
          </svg>
          Sair
        </button>
      </div>
    </aside>

    <header class="md:hidden w-full bg-[#E4F3F4] flex items-center justify-between px-4 py-3 fixed top-0 z-20 shadow-sm">
      <img src="../img/logo.png" alt="Logo Delícia Gelada" class="w-16">
      
      <div class="flex items-center gap-4">
        <p class="text-gray-700 text-xs tracking-widest font-medium">Área Administrativa</p>
        
        <button onclick="window.location.href='../../admin.html'" class="text-red-500 hover:text-red-700 transition" title="Sair">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
          </svg>
        </button>
      </div>
    </header>

    <main class="flex-1 w-full md:ml-64 p-6 pt-24 pb-12 md:pt-12 md:p-12 min-h-screen flex items-center">
      
      <div class="max-w-5xl mx-auto w-full">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">

          <div class="bg-white rounded-xl flex items-center justify-between px-8 py-10 md:px-12 md:py-12 min-h-[220px] md:min-h-[240px] shadow-sm cursor-pointer hover:shadow-md transition border border-gray-100"
            onclick="window.location.href='../pages/nova-bebida.html'">
            <span class="text-[#005A9C] font-bold text-2xl md:text-3xl leading-snug">Adicionar<br>Bebida</span>
            
            <button class="w-16 h-16 md:w-[76px] md:h-[76px] shrink-0 bg-[#FF9800] hover:bg-orange-500 rounded-full text-white flex items-center justify-center shadow transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:h-10 md:w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </button>
          </div>

          <div class="bg-white rounded-xl flex items-center justify-between px-8 py-10 md:px-12 md:py-12 min-h-[220px] md:min-h-[240px] shadow-sm cursor-pointer hover:shadow-md transition border border-gray-100"
            onclick="window.location.href='../pages/novo-admin.html'">
            <span class="text-[#005A9C] font-bold text-2xl md:text-3xl leading-snug">Adicionar<br>Admin</span>
            
            <button class="w-16 h-16 md:w-[76px] md:h-[76px] shrink-0 bg-[#FF9800] hover:bg-orange-500 rounded-full text-white flex items-center justify-center shadow transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:h-10 md:w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </button>
          </div>

          <div class="bg-white rounded-xl flex items-center justify-between px-8 py-10 md:px-12 md:py-12 min-h-[220px] md:min-h-[240px] shadow-sm cursor-pointer hover:shadow-md transition border border-gray-100"
            onclick="window.location.href='../pages/nova-categoria.html'">
            <span class="text-[#005A9C] font-bold text-2xl md:text-3xl leading-snug">Adicionar<br>Categoria</span>
            
            <button class="w-16 h-16 md:w-[76px] md:h-[76px] shrink-0 bg-[#FF9800] hover:bg-orange-500 rounded-full text-white flex items-center justify-center shadow transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:h-10 md:w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </button>
          </div>

          <div class="bg-white rounded-xl flex flex-col items-center justify-center gap-6 px-8 py-10 md:px-12 md:py-12 min-h-[220px] md:min-h-[240px] shadow-sm border border-gray-100">
            <span class="text-[#005A9C] font-bold text-2xl md:text-3xl mb-2">Lista Completa</span>
            
            <div class="flex flex-col gap-3 w-full items-center">
              <button onclick="window.location.href='../pages/lista-bebidas.html'"
                class="border border-gray-300 rounded-md px-6 py-3 text-sm font-bold text-[#005A9C] hover:bg-gray-50 hover:border-[#005A9C] transition w-full max-w-[280px] text-center shadow-sm">
                Bebidas
              </button>
              <button onclick="window.location.href='../pages/lista-categoria.html'"
                class="border border-gray-300 rounded-md px-6 py-3 text-sm font-bold text-[#005A9C] hover:bg-gray-50 hover:border-[#005A9C] transition w-full max-w-[280px] text-center shadow-sm">
                Categorias
              </button>
              <button onclick="window.location.href='../pages/lista-admins.html'"
                class="border border-gray-300 rounded-md px-6 py-3 text-sm font-bold text-[#005A9C] hover:bg-gray-50 hover:border-[#005A9C] transition w-full max-w-[280px] text-center shadow-sm">
                Admins
              </button>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

</body>
</html>

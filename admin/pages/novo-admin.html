<!DOCTYPE html>
<html lang="pt-br" class="font-inter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Admin | Delicia Gelada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/admin.js" defer></script>
  <script src="../js/usuario.js" defer></script>
</head>
<body class="font-sans bg-gray-50">

  <div id="tela-adicionar-admin" class="min-h-screen w-full flex">
    
    <aside class="hidden md:flex w-64 bg-[#E4F3F4] flex-col items-center py-8 px-4 h-screen fixed top-0 left-0 z-20">
      <img src="../img/logo.png" alt="Logo Delícia Gelada" class="w-28 mb-6">
      <p class="text-gray-900 text-sm tracking-widest mb-auto font-medium" style="font-family: cursive;">Área Administrativa</p>
      
      <div class="flex flex-col items-center gap-2 mt-auto">
        <img id="foto-admin-sidebar" src="../img/gestor.png" alt="Foto do gestor"
          class="w-20 h-20 rounded-full object-cover border-2 border-white shadow">
        <p id="nome-admin-sidebar" class="text-sm font-bold text-gray-800">Carregando...</p>
        <p id="cargo-admin-sidebar" class="text-xs text-gray-600 font-medium">...</p>
      </div>
    </aside>

    <header class="md:hidden w-full bg-[#E4F3F4] flex items-center justify-between px-4 py-3 fixed top-0 z-20 shadow-sm">
      <img src="../img/logo.png" alt="Logo Delícia Gelada" class="w-16">
      <p class="text-gray-700 text-xs tracking-widest font-medium">Área Administrativa</p>
    </header>

    <main class="md:pl-64 w-full min-h-screen p-6 pt-24 pb-12 md:pt-10 md:p-12 flex flex-col">
      
      <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col">
        
        <div class="flex items-center gap-3 mb-8 md:mb-10">
          <div class="w-1.5 h-8 md:h-10 bg-orange-500 rounded-sm shrink-0"></div>
          <h2 class="text-[#005A9C] font-bold text-2xl md:text-3xl leading-tight">Adicionar Novo Admin</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 w-full">
          
          <div>
            <label class="text-[#005A9C] font-bold text-sm block mb-2">NOME</label>
            <input type="text" id="nomeAdmin" placeholder="Ex: Ana Silva"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
          </div>

          <div>
            <label class="text-[#005A9C] font-bold text-sm block mb-2">E-MAIL CORPORATIVO</label>
            <input type="email" id="emailAdmin" placeholder="Ex: ana@deliciagelada.com"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
          </div>

          <div>
            <label class="text-[#005A9C] font-bold text-sm block mb-2">CARGO / FUNÇÃO</label>
            <select id="cargoAdmin" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
              <option value="" disabled selected>Selecione um cargo...</option>
              </select>
          </div>

          <div>
            <label class="text-[#005A9C] font-bold text-sm block mb-2">SENHA PROVISÓRIA</label>
            <input type="text" id="senhaAdmin" placeholder="Ex: 123456"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
          </div>
        </div>

        <div class="mt-8 md:mt-10">
          <label class="text-[#005A9C] font-bold text-sm block mb-2">IMAGEM DO FUNCIONÁRIO</label>
          
          <label for="imagemAdmin" class="relative flex flex-col items-center justify-center w-40 h-48 md:w-48 md:h-56 bg-white border-2 border-gray-300 border-dashed rounded-xl cursor-pointer hover:bg-gray-50 overflow-hidden group">
            <input type="file" id="imagemAdmin" accept="image/*" class="hidden" onchange="previewImagem(event)" />
            
            <div id="textoUpload" class="flex flex-col items-center justify-center text-gray-400 px-4 text-center">
              <svg class="w-8 h-8 mb-2" aria-hidden="true" fill="none" viewBox="0 0 20 16" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
              </svg>
              <p class="text-xs font-semibold">Adicionar Foto</p>
            </div>

            <img id="preview" src="" alt="Preview" class="absolute inset-0 w-full h-full object-cover hidden z-10 group-hover:opacity-80 transition">
          </label>
        </div>

        <div class="flex flex-col md:flex-row justify-end gap-4 mt-10 md:mt-12">
          <button onclick="window.location.href='../pages/dashboard.html'"
            class="w-full md:w-auto px-10 py-3.5 bg-[#E2E8F0] hover:bg-gray-300 text-gray-600 font-bold text-sm rounded-md transition order-2 md:order-1">
            CANCELAR
          </button>
          <button onclick="salvarNovoAdmin()"
            class="w-full md:w-auto px-10 py-3.5 bg-[#FF9800] hover:bg-orange-500 text-white font-bold text-sm rounded-md transition shadow-md order-1 md:order-2">
            SALVAR ADMIN
          </button>
        </div>
      </div>
    </main>
  </div>

</body>
</html>

<!--------------------------------------------------------------------------------------
 * Objetivo: Arquivo responsável pela listagem e gerenciamento de bebidas adicionadas
 * Data: 16/06/2026
 * Autora: Jean Costa
 * Versão: 1.0
---------------------------------------------------------------------------------------->

<!DOCTYPE html>
<html lang="pt-br" class="font-inter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bebidas Adicionadas | Delicia Gelada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/admin.js" defer></script>
  <script src="../js/nova_bebida.js" defer></script>
</head>
<body class="font-sans bg-gray-50">

  <div id="tela-lista-bebidas" class="min-h-screen flex">
    
    <aside class="hidden md:flex w-64 bg-[#E4F3F4] flex-col items-center py-8 px-4 h-screen fixed top-0 left-0 z-20">
      <img src="../img/logo.png" alt="Logo Delícia Gelada" class="w-28 mb-6">
      <p class="text-gray-900 text-sm tracking-widest mb-auto font-medium" style="font-family: cursive;">Área Administrativa</p>
      
      <div class="flex flex-col items-center gap-2 mt-auto">
        <img id="foto-admin-sidebar" src="../img/gestor.png" alt="Foto do gestor" class="w-20 h-20 rounded-full object-cover border-2 border-white shadow">
        <p id="nome-admin-sidebar" class="text-sm font-bold text-gray-800">Carregando...</p>
        <p id="cargo-admin-sidebar" class="text-xs text-gray-600 font-medium">Carregando...</p>
      </div>
    </aside>

    <header class="md:hidden w-full bg-[#E4F3F4] flex items-center justify-between px-4 py-3 fixed top-0 z-20 shadow-sm">
      <img src="../img/logo.png" alt="Logo Delícia Gelada" class="w-16">
      <p class="text-gray-700 text-xs tracking-widest font-medium">Área Administrativa</p>
    </header>

    <main class="md:ml-64 flex-1 min-h-screen pt-24 pb-12 px-5 md:pt-12 md:px-12 flex flex-col w-full">
      <div class="max-w-6xl mx-auto w-full flex-1 flex flex-col">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-5 mb-8">
          <div class="flex items-center gap-4">
            <button onclick="window.location.href='../pages/dashboard.html'" 
              class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full border border-gray-300 text-[#005A9C] hover:bg-gray-100 transition shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 md:w-6 md:h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
              </svg>
            </button>
            <h2 class="text-[#005A9C] font-bold text-2xl md:text-4xl tracking-tight">Bebidas Adicionadas</h2>
          </div>

          <div class="relative w-full md:w-72 shrink-0">
            <input type="text" placeholder="Buscar bebida..." 
              class="w-full border border-gray-300 rounded-lg md:rounded-full pl-4 pr-10 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#005A9C] transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </div>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-x-auto flex-1 h-full">
         <table id="tabela-bebidas" class="w-full text-left border-collapse min-w-[900px]">
              <thead>
                <tr class="bg-[#0b629e] text-white text-center">
                  <th class="py-5 px-6 font-semibold text-sm tracking-wide text-left w-1/4">NOME DA BEBIDA</th>
                  <th class="py-5 px-6 font-semibold text-sm tracking-wide border-l border-[#2e7eb3]">CATEGORIA</th>
                  <th class="py-5 px-6 font-semibold text-sm tracking-wide border-l border-[#2e7eb3]">TIPO</th>
                  <th class="py-5 px-6 font-semibold text-sm tracking-wide border-l border-[#2e7eb3]">PREÇO</th>
                  <th class="py-5 px-6 font-semibold text-sm tracking-wide w-40 border-l border-[#2e7eb3]">AÇÕES</th>
                </tr>
              </thead>
              <tbody>
                
              </tbody>
            </table>
        </div>

      </div>
    </main>
  </div>

  <!-- ================= MODAL DE EDIÇÃO: BEBIDAS ================= -->
  <div id="modal-editar-bebida" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center backdrop-blur-sm p-4">
    <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl overflow-hidden flex flex-col transform transition-all">
      <div class="bg-[#E4F3F4] px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-[#005A9C] font-bold text-xl flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
          Editar Bebida
        </h3>
        <button onclick="fecharModal()" class="text-gray-500 hover:text-red-500 transition p-1">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      
      <div class="p-6 flex flex-col gap-5">
        <!-- Upload de Nova Imagem -->
        <div>
          <label class="text-[#005A9C] font-bold text-sm block mb-2">ALTERAR IMAGEM (Opcional)</label>
          <label for="editBebImagem" class="relative flex flex-col items-center justify-center w-full h-32 bg-white border-2 border-gray-300 border-dashed rounded-xl cursor-pointer hover:bg-gray-50 overflow-hidden group">
            <input type="file" id="editBebImagem" accept="image/*" class="hidden" onchange="previewImagem(event, 'previewEditBeb', 'textoUploadEditBeb')" />
            
            <div id="textoUploadEditBeb" class="flex flex-col items-center justify-center text-gray-400">
              <svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
              <p class="text-xs font-semibold">Nova Foto</p>
            </div>
            <img id="previewEditBeb" src="" class="absolute inset-0 w-full h-full object-cover hidden z-10 group-hover:opacity-80 transition">
          </label>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="text-[#005A9C] font-bold text-sm block mb-1">NOME DA BEBIDA</label>
            <input type="text" id="editBebNome" class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-400 outline-none transition">
          </div>
          <div class="col-span-2 md:col-span-1">
            <label class="text-[#005A9C] font-bold text-sm block mb-1">CATEGORIA</label>
            <input type="text" id="editBebCat" class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-400 outline-none transition">
          </div>
          <div class="col-span-2 md:col-span-1">
            <label class="text-[#005A9C] font-bold text-sm block mb-1">TIPO</label>
            <input type="text" id="editBebTipo" class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-400 outline-none transition">
          </div>
          <div class="col-span-2">
            <label class="text-[#005A9C] font-bold text-sm block mb-1">PREÇO (R$)</label>
            <input type="text" id="editBebPreco" class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-400 outline-none transition">
          </div>
        </div>
      </div>

      <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end gap-3">
        <button onclick="fecharModal()" class="px-6 py-2.5 bg-gray-200 text-gray-700 font-bold text-sm rounded-lg hover:bg-gray-300 transition">CANCELAR</button>
        <button onclick="salvarEdicaoModal()" class="px-6 py-2.5 bg-[#FF9800] text-white font-bold text-sm rounded-lg hover:bg-orange-500 transition shadow-md">SALVAR ALTERAÇÕES</button>
      </div>
    </div>
  </div>

</body>
</html>

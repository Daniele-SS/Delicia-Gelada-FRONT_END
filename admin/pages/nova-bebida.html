<!DOCTYPE html>
<html lang="pt-br" class="font-inter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Bebida | Delicia Gelada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/admin.js" defer></script>
</head>
<body class="font-sans bg-gray-50">

  <div id="tela-adicionar-bebida" class="min-h-screen w-full flex">
    
    <aside class="hidden md:flex w-64 bg-[#E4F3F4] flex-col items-center py-8 px-4 h-screen fixed top-0 left-0 z-20">
      <img src="../img/logo.png" alt="Logo Delícia Gelada" class="w-28 mb-6">
      <p class="text-gray-900 text-sm tracking-widest mb-auto font-medium" style="font-family: cursive;">Área Administrativa</p>
      
      <div class="flex flex-col items-center gap-2 mt-auto">
        <img src="../img/gestor.png" alt="Foto do gestor"
          class="w-20 h-20 rounded-full object-cover border-2 border-white shadow">
        <p class="text-sm font-bold text-gray-800">NOME</p>
        <p class="text-xs text-gray-600 font-medium">Gestor</p>
      </div>
    </aside>

    <header class="md:hidden w-full bg-[#E4F3F4] flex items-center justify-between px-4 py-3 fixed top-0 z-20 shadow-sm">
      <img src="../img/logo.png" alt="Logo Delícia Gelada" class="w-16">
      <p class="text-gray-700 text-xs tracking-widest font-medium">Área Administrativa</p>
    </header>

    <main class="md:pl-64 w-full min-h-screen p-6 pt-24 pb-12 md:pt-10 md:p-12">
      
      <div class="max-w-5xl mx-auto w-full">
        
        <div class="flex items-center gap-3 mb-8 md:mb-10">
          <div class="w-1.5 h-8 md:h-10 bg-orange-500 rounded-sm shrink-0"></div>
          <h2 class="text-[#005A9C] font-bold text-2xl md:text-3xl leading-tight">Adicionar Nova Bebida</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">
          
          <div class="flex flex-col gap-5">
            <div>
              <label class="text-[#005A9C] font-bold text-sm block mb-2">NOME DA BEBIDA</label>
              <input type="text" id="nomeBebida" placeholder="Ex: Coquetel de Verão Tropical"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div>
              <label class="text-[#005A9C] font-bold text-sm block mb-2">CATEGORIA</label>
              <select id="categoriaBebida" class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 text-gray-600">
                <option value="">Selecione uma categoria...</option>
              </select>
            </div>

            <div>
              <label class="text-[#005A9C] font-bold text-sm block mb-2">DESCRIÇÃO DA BEBIDA</label>
              <textarea id="descricaoBebida" rows="4" placeholder="Descrição da bebida..."
                class="w-full border border-gray-300 rounded-lg px-4 py-3 resize-none text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
            </div>

            <div class="mt-2">
              <label class="inline-flex items-center cursor-pointer">
                <input type="checkbox" id="produtoAtivo" class="sr-only peer" checked>
                <div class="relative w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#5C5CFF]"></div>
                <span class="ms-3 text-xs font-bold text-[#005A9C]">Produto Ativo</span>
              </label>
            </div>
          </div>

          <div class="flex flex-col gap-5 justify-between">
            
            <div>
              <label class="text-[#005A9C] font-bold text-sm block mb-2">IMAGEM DA BEBIDA</label>
              
              <label for="imagemBebida" class="relative flex flex-col items-center justify-center w-full h-40 md:h-[210px] bg-white border-2 border-gray-300 border-dashed rounded-xl cursor-pointer hover:bg-gray-50 overflow-hidden group">
                <input type="file" id="imagemBebida" accept="image/*" class="hidden" onchange="previewImagem(event)" />
                
                <div id="textoUpload" class="flex flex-col items-center justify-center pt-5 pb-6 text-gray-400 px-4 text-center">
                  <svg class="w-8 h-8 mb-3" aria-hidden="true" fill="none" viewBox="0 0 20 16" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                  </svg>
                  <p class="text-sm"><span class="font-semibold">Clique para enviar</span> ou arraste</p>
                  <p class="text-xs mt-1">PNG, JPG ou WEBP</p>
                </div>

                <img id="preview" src="" alt="Preview" class="absolute inset-0 w-full h-full object-cover hidden z-10 group-hover:opacity-80 transition">
              </label>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-[#005A9C] font-bold text-sm block mb-2">TIPO</label>
                <input type="text" id="tipoBebida" placeholder="Ex: Batido"
                  class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
              </div>
              <div>
                <label class="text-[#005A9C] font-bold text-sm block mb-2">PREÇO (R$)</label>
                <input type="text" id="precoBebida" placeholder="00,00"
                  class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
              </div>
            </div>
          </div>

        </div>

        <div class="flex flex-col md:flex-row justify-end gap-4 mt-10 md:mt-12">
          <button onclick="window.location.href='../pages/dashboard.html'"
            class="w-full md:w-auto px-10 py-3.5 bg-[#E2E8F0] hover:bg-gray-300 text-gray-600 font-bold text-sm rounded-md transition order-2 md:order-1">
            CANCELAR
          </button>
          <button onclick="salvarNovaBebida(event)"
            class="w-full md:w-auto px-10 py-3.5 bg-[#FF9800] hover:bg-orange-500 text-white font-bold text-sm rounded-md transition shadow-md order-1 md:order-2">
            SALVAR PRODUTO
          </button>
        </div>

      </div> 
    </main>
  </div>

</body>
</html>

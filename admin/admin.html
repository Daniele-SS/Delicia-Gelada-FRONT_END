<!DOCTYPE html>
<html lang="pt-br" class="font-inter">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área Administrativa | Delicia Gelada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="font-sans text-gray-900">

  <div class="relative h-screen w-full">

    <!-- imagem de fundo -->
    <img src="./img/body.jpeg" alt="Corpo da tela" class="absolute inset-0 h-full w-full object-cover">

    <!-- conteúdo por cima -->
    <div class="relative z-10 flex h-full">

      <!-- lado esquerdo: formulário -->
      <div class="flex flex-col justify-center items-center w-full md:w-1/2 px-12">

        <img src="./img/logo.png" alt="Logo Delícia Gelada" class="w-36 mb-6">

        <h1 class="text-orange-500 font-bold text-2xl text-center mb-6">
          Bem-vindo à Área Administrativa!
        </h1>

        <!-- formulário -->
        <div class="w-full max-w-sm flex flex-col gap-4">

          <input type="email" placeholder="Email"
            class="w-full border border-gray-300 rounded px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-orange-400">

          <div class="relative">
            <input type="password" placeholder="Senha" id="inputSenha"
              class="w-full border border-gray-300 rounded px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-orange-400">

            <!-- ícone mostrar/ocultar senha -->
            <button type="button" onclick="toggleSenha()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">
            </button>

          </div>

          <!-- link esqueceu senha -->
          <div class="text-center">
            <a href="#" class="text-blue-500 text-sm hover:underline">
              Esqueceu sua senha ?
            </a>
          </div>

          <button
            onclick="irParaDashboard()"
            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded tracking-widest transition">
            ENTRAR
          </button>

        </div>
      </div>

      <div class="hidden md:block md:w-1/2"></div>
    </div>
  </div>

  <!-- ==================== TELA 2: DASHBOARD ==================== -->
  <div id="tela-dashboard" class="hidden font-sans bg-gray-100 h-screen flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-blue-100 flex flex-col items-center py-8 px-4 h-screen fixed">
      <img src="./img/logo.png" alt="Logo Delícia Gelada" class="w-28 mb-6">
      <p class="text-gray-700 text-sm tracking-widest mb-auto">Área Administrativa</p>
      <div class="flex flex-col items-center gap-2 mt-auto">
        <img src="./img/gestor.png" alt="Foto do gestor"
          class="w-24 h-24 rounded-full object-cover border-4 border-white shadow">
        <p class="text-sm font-semibold text-gray-700">Rodrigo</p>
        <p class="text-xs text-gray-500">Gestor</p>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="ml-64 flex-1 p-10">
      <div class="grid grid-cols-2 gap-6">

        <!-- card: Adicionar Bebida -->
        <div class="bg-white rounded-lg flex items-center justify-between px-10 py-8 shadow-sm cursor-pointer hover:shadow-md transition"
          onclick="mostrarSecao('bebida')">
          <span class="text-blue-600 font-bold text-2xl leading-tight">Adicionar<br>Bebida</span>
          <button class="w-16 h-16 bg-orange-500 hover:bg-orange-600 rounded-full text-white text-3xl font-bold flex items-center justify-center shadow transition">+</button>
        </div>

        <!-- card: Adicionar Admin -->
        <div class="bg-white rounded-lg flex items-center justify-between px-10 py-8 shadow-sm cursor-pointer hover:shadow-md transition"
          onclick="mostrarSecao('admin')">
          <span class="text-blue-600 font-bold text-2xl leading-tight">Adicionar<br>Admin</span>
          <button class="w-16 h-16 bg-orange-500 hover:bg-orange-600 rounded-full text-white text-3xl font-bold flex items-center justify-center shadow transition">+</button>
        </div>

        <!-- card: Adicionar Categoria -->
        <div class="bg-white rounded-lg flex items-center justify-between px-10 py-8 shadow-sm cursor-pointer hover:shadow-md transition"
          onclick="mostrarSecao('categoria')">
          <span class="text-blue-600 font-bold text-2xl leading-tight">Adicionar<br>Categoria</span>
          <button class="w-16 h-16 bg-orange-500 hover:bg-orange-600 rounded-full text-white text-3xl font-bold flex items-center justify-center shadow transition">+</button>
        </div>

        <!-- card: Lista Completa -->
        <div class="bg-white rounded-lg flex flex-col items-center justify-center gap-4 px-10 py-8 shadow-sm">
          <span class="text-blue-600 font-bold text-xl">Lista Completa</span>
          <div class="flex flex-col gap-2 w-full items-center">
            <button onclick="mostrarSecao('lista-bebidas')"
              class="border border-gray-300 rounded px-6 py-1 text-sm text-gray-700 hover:bg-gray-50 transition w-32 text-center">
              Bebidas
            </button>
            <button onclick="mostrarSecao('lista-categorias')"
              class="border border-gray-300 rounded px-6 py-1 text-sm text-gray-700 hover:bg-gray-50 transition w-32 text-center">
              Categorias
            </button>
            <button onclick="mostrarSecao('lista-admins')"
              class="border border-gray-300 rounded px-6 py-1 text-sm text-gray-700 hover:bg-gray-50 transition w-32 text-center">
              Admins
            </button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="./js/admin.js"></script>

</body>
</html>
